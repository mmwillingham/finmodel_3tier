steps:
  - name: 'bash'
    id: 'Generate Variables'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        FIXED_TIMESTAMP=$(date +%Y%m%d%H%M%S)
        printf 'export _FIXED_TIMESTAMP=%s\n' "$${FIXED_TIMESTAMP}" > /workspace/env_vars.sh
        printf 'export ENVIRONMENT=%s\n' "${_ENVIRONMENT}" >> /workspace/env_vars.sh
        printf 'export DB_HOST=%s\n' "${_DB_HOST}" >> /workspace/env_vars.sh
        printf 'export STRIPE_SUCCESS_URL=%s\n' "${_STRIPE_SUCCESS_URL}" >> /workspace/env_vars.sh
        printf 'export STRIPE_CANCEL_URL=%s\n' "${_STRIPE_CANCEL_URL}" >> /workspace/env_vars.sh
        echo "--- env_vars.sh ---"
        cat /workspace/env_vars.sh
        echo "-------------------"

  # 1. Build & Push Backend
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Backend Image'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        source /workspace/env_vars.sh
        BACKEND_TAG="${_IMAGE_REPO}/${_ENVIRONMENT}-backend:${COMMIT_SHA}-$${_FIXED_TIMESTAMP}"
        docker build --no-cache --pull -f api/Dockerfile -t "$${BACKEND_TAG}" api --build-arg CACHEBUSTER=$${_FIXED_TIMESTAMP}

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Inspect Backend Image'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        source /workspace/env_vars.sh
        BACKEND_TAG="${_IMAGE_REPO}/${_ENVIRONMENT}-backend:${COMMIT_SHA}-$${_FIXED_TIMESTAMP}"
        docker run --rm "$${BACKEND_TAG}" \
          /bin/sh -c "sha256sum /app/api/alembic/versions/20260226_add_default_document_folders.py && head -n 40 /app/api/alembic/versions/20260226_add_default_document_folders.py"
    waitFor: ['Build Backend Image']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Backend Image'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        source /workspace/env_vars.sh
        BACKEND_TAG="${_IMAGE_REPO}/${_ENVIRONMENT}-backend:${COMMIT_SHA}-$${_FIXED_TIMESTAMP}"
        docker push "$${BACKEND_TAG}"
        DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$${BACKEND_TAG}")
        if [[ -z "$${DIGEST}" ]]; then
          echo "Failed to resolve digest for $${BACKEND_TAG}" >&2
          exit 1
        fi
        printf 'export _BACKEND_IMAGE_DIGEST=%s\n' "$${DIGEST}" >> /workspace/env_vars.sh
    waitFor: ['Build Backend Image']

  # 2. Database Migrations (Triggering the Cloud Run Job)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Run Alembic Migrations via Job'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        source /workspace/env_vars.sh
        if [[ -z "$${_BACKEND_IMAGE_DIGEST}" ]]; then
          echo "Backend image digest is empty" >&2
          ls -l /workspace/env_vars.sh
          cat /workspace/env_vars.sh
          exit 1
        fi
        echo "Using backend digest: $${_BACKEND_IMAGE_DIGEST}"
        gcloud run jobs update mmr-${_ENVIRONMENT}-migrate \
          --image $${_BACKEND_IMAGE_DIGEST} \
          --region ${_REGION} \
          --execute-now \
          --wait
    waitFor: ['Push Backend Image']


# 3. Deploy Backend (Standardized for Direct VPC)
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Deploy Backend Service'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        source /workspace/env_vars.sh
        if [[ -z "$${STRIPE_SUCCESS_URL}" || -z "$${STRIPE_CANCEL_URL}" ]]; then
          echo "Missing Stripe URL substitutions. Required: _STRIPE_SUCCESS_URL, _STRIPE_CANCEL_URL" >&2
          exit 1
        fi
        gcloud run deploy ${_BACKEND_SERVICE_NAME} \
          --image ${_IMAGE_REPO}/${_ENVIRONMENT}-backend:${COMMIT_SHA}-$${_FIXED_TIMESTAMP} \
          --region ${_REGION} \
          --platform managed \
          --allow-unauthenticated \
          --project ${PROJECT_ID} \
          --service-account ${_SERVICE_ACCOUNT} \
          --set-env-vars="DB_HOST=${_DB_HOST},\
            CLOUD_SQL_CONNECTION_NAME=${_SQL_INSTANCE},\
            GCS_BUCKET_NAME=${_GCS_BUCKET},\
            GCS_PROJECT_ID=${PROJECT_ID},\
            PUBLIC_BACKEND_URL=${_BACKEND_URL},\
            FRONTEND_URL=${_FRONTEND_URL},\
            CORS_ORIGINS_REGEX=${_CORS_ORIGINS_REGEX},\
            PLAID_ENV=sandbox,\
            DB_USER=${_DB_USER},\
            DB_NAME=${_DB_NAME},\
            MAIL_USERNAME=martin.willingham@gmail.com,\
            MAIL_FROM=no_reply@gmail.com,\
            MAIL_PORT=587,\
            MAIL_SERVER=smtp.gmail.com,\
            MAIL_TLS=True,\
            MAIL_SSL=False,\
            USE_CREDENTIALS=True,\
            VALIDATE_CERTS=True,\
            STRIPE_PREMIUM_PRICE_ID=${_STRIPE_PREMIUM_PRICE_ID},\
            STRIPE_PRO_PRICE_ID=${_STRIPE_PRO_PRICE_ID},\
            STRIPE_SUCCESS_URL=$${STRIPE_SUCCESS_URL},\
            STRIPE_CANCEL_URL=$${STRIPE_CANCEL_URL},\
            SENTRY_DSN=${_SENTRY_DSN},\
            ENVIRONMENT=${_ENVIRONMENT}" \
          --set-secrets="DB_PASSWORD=${_DB_PASSWORD}:latest,\
            SECRET_KEY=_SECRET_KEY:1,\
            GOOGLE_CLIENT_SECRET=${_GOOGLE_CLIENT_SECRET},\
            GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID},\
            MAIL_PASSWORD=_MAIL_PASSWORD:1,\
            PLAID_SECRET=_PLAID_SECRET:1,\
            PLAID_ENCRYPTION_KEY=_PLAID_ENCRYPTION_KEY:1,\
            PLAID_CLIENT_ID=_PLAID_CLIENT_ID:1,\
            OPENAI_API_KEY=_OPENAI_API_KEY:1,\
            OPENAI_API_KEY_PRO=_OPENAI_API_KEY_PRO:1,\
            MMR_SHIELD_KEY=_MMR_SHIELD_KEY:1,\
            STRIPE_API_KEY=${_STRIPE_API_KEY_SECRET}:latest,\
            STRIPE_WEBHOOK_SECRET=${_STRIPE_WEBHOOK_SECRET_NAME}:latest" \
          --cpu=1 \
          --memory=512Mi \
          --min-instances=0 \
          --cpu-boost \
          --concurrency=80 \
          --timeout=30m \
          --no-traffic \
          --network=default \
          --subnet=default \
          --vpc-egress=private-ranges-only
    waitFor: ['Run Alembic Migrations via Job']

  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Update Backend Traffic'
    args: ['run', 'services', 'update-traffic', '${_BACKEND_SERVICE_NAME}', '--region', '${_REGION}', '--to-latest']
    waitFor: ['Deploy Backend Service']

  # 4. Frontend Build & Deploy
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Frontend Image'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        source /workspace/env_vars.sh
        docker build --no-cache \
        -t ${_IMAGE_REPO}/${_ENVIRONMENT}-frontend:${COMMIT_SHA}-$${_FIXED_TIMESTAMP} \
        --build-arg=REACT_APP_API_URL=${_BACKEND_URL} \
        --build-arg=REACT_APP_FRONTEND_URL=${_FRONTEND_URL} \
        --build-arg=VITE_MMR_SHIELD_KEY=$$MMR_SHIELD_KEY .
    dir: 'ui'
    secretEnv: ['MMR_SHIELD_KEY']
    waitFor: ['Update Backend Traffic']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Frontend Image'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        source /workspace/env_vars.sh
        FRONTEND_TAG="${_IMAGE_REPO}/${_ENVIRONMENT}-frontend:${COMMIT_SHA}-$${_FIXED_TIMESTAMP}"
        docker push "$${FRONTEND_TAG}"
    waitFor: ['Build Frontend Image']

  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Deploy Frontend Service'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        source /workspace/env_vars.sh
        FRONTEND_TAG="${_IMAGE_REPO}/${_ENVIRONMENT}-frontend:${COMMIT_SHA}-$${_FIXED_TIMESTAMP}"
        gcloud run deploy ${_FRONTEND_SERVICE_NAME} \
          --image "$${FRONTEND_TAG}" \
          --region ${_REGION} \
          --platform managed \
          --allow-unauthenticated
    waitFor: ['Push Frontend Image']

options:
  default_logs_bucket_behavior: 'REGIONAL_USER_OWNED_BUCKET'

availableSecrets:
  secretManager:
  - versionName: projects/${PROJECT_ID}/secrets/_MMR_SHIELD_KEY/versions/latest
    env: 'MMR_SHIELD_KEY'  
