steps:
  - name: 'bash'
    id: 'Generate Variables'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        export _FIXED_TIMESTAMP=$(date +%Y%m%d%H%M%S)
        echo "export _FIXED_TIMESTAMP=${_FIXED_TIMESTAMP}" > /workspace/env_vars.sh
        echo "export ENVIRONMENT=${_ENVIRONMENT}" >> /workspace/env_vars.sh
        echo "export DB_HOST=${_DB_HOST}" >> /workspace/env_vars.sh

  # 1. Build & Push Backend
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Backend Image'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        source /workspace/env_vars.sh
        docker build --no-cache --pull -f api/Dockerfile -t ${_IMAGE_REPO}/${_ENVIRONMENT}-backend:${COMMIT_SHA}-${_FIXED_TIMESTAMP} api --build-arg CACHEBUSTER=${_FIXED_TIMESTAMP}

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Inspect Backend Image'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        source /workspace/env_vars.sh
        docker run --rm ${_IMAGE_REPO}/${_ENVIRONMENT}-backend:${COMMIT_SHA}-${_FIXED_TIMESTAMP} \
          /bin/sh -c "sha256sum /app/api/alembic/versions/20260226_add_default_document_folders.py && head -n 40 /app/api/alembic/versions/20260226_add_default_document_folders.py"
    waitFor: ['Build Backend Image']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Backend Image'
    args: ['push', '${_IMAGE_REPO}/${_ENVIRONMENT}-backend:${COMMIT_SHA}-${_FIXED_TIMESTAMP}']
    waitFor: ['Build Backend Image']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Record Backend Digest'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        source /workspace/env_vars.sh
        TAG="${_IMAGE_REPO}/${_ENVIRONMENT}-backend:${COMMIT_SHA}-${_FIXED_TIMESTAMP}"
        DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$${TAG}" | tr -d '\n')
        if [[ -z "$${DIGEST}" ]]; then
          echo "Failed to resolve backend digest for $${TAG}" >&2
          exit 1
        fi
        printf 'export _BACKEND_IMAGE_DIGEST=%s\n' "$${DIGEST}" >> /workspace/env_vars.sh
    waitFor: ['Push Backend Image']

  # 2. Database Migrations (Triggering the Cloud Run Job)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Run Alembic Migrations via Job'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        source /workspace/env_vars.sh
        gcloud run jobs update mmr-${_ENVIRONMENT}-migrate \
          --image ${_BACKEND_IMAGE_DIGEST} \
          --region ${_REGION} \
          --execute-now \
          --wait
    waitFor: ['Record Backend Digest']

  # 3. Deploy Backend (Standardized for Direct VPC)
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Deploy Backend Service'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        source /workspace/env_vars.sh
        gcloud run deploy ${_BACKEND_SERVICE_NAME} \
          --image ${_IMAGE_REPO}/${_ENVIRONMENT}-backend:${COMMIT_SHA}-${_FIXED_TIMESTAMP} \
          --region ${_REGION} \
          --platform managed \
          --allow-unauthenticated \
          --project ${PROJECT_ID} \
          --service-account ${_SERVICE_ACCOUNT} \
          --set-env-vars="DB_HOST=${_DB_HOST},CLOUD_SQL_CONNECTION_NAME=${_SQL_INSTANCE},GCS_BUCKET_NAME=${_GCS_BUCKET},GCS_PROJECT_ID=${PROJECT_ID},PUBLIC_BACKEND_URL=${_BACKEND_URL},FRONTEND_URL=${_FRONTEND_URL},CORS_ORIGINS_REGEX=${_CORS_ORIGINS_REGEX},PLAID_ENV=sandbox,DB_USER=${_DB_USER},DB_NAME=${_DB_NAME},MAIL_USERNAME=martin.willingham@gmail.com,MAIL_FROM=no_reply@gmail.com,MAIL_PORT=587,MAIL_SERVER=smtp.gmail.com,MAIL_TLS=True,MAIL_SSL=False,USE_CREDENTIALS=True,VALIDATE_CERTS=True" \
          --set-secrets="DB_PASSWORD=_DB_PASSWORD:${_DB_SECRET_VER},SECRET_KEY=_SECRET_KEY:1,GOOGLE_CLIENT_SECRET=${_GOOGLE_CLIENT_SECRET},GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID},MAIL_PASSWORD=_MAIL_PASSWORD:1,PLAID_SECRET=_PLAID_SECRET:1,PLAID_ENCRYPTION_KEY=_PLAID_ENCRYPTION_KEY:1,PLAID_CLIENT_ID=_PLAID_CLIENT_ID:1,OPENAI_API_KEY=_OPENAI_API_KEY:1,OPENAI_API_KEY_PRO=_OPENAI_API_KEY_PRO:1" \
          --cpu=1 \
          --memory=512Mi \
          --min-instances=0 \
          --cpu-boost \
          --concurrency=80 \
          --timeout=30m \
          --no-traffic \
          --network=default \
          --subnet=default \
          --vpc-egress=private-ranges-only
    waitFor: ['Run Alembic Migrations via Job']

  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Update Backend Traffic'
    args: ['run', 'services', 'update-traffic', '${_BACKEND_SERVICE_NAME}', '--region', '${_REGION}', '--to-latest']
    waitFor: ['Deploy Backend Service']

  # 4. Frontend Build & Deploy
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Frontend Image'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        source /workspace/env_vars.sh
        docker build --no-cache -t ${_IMAGE_REPO}/${_ENVIRONMENT}-frontend:${COMMIT_SHA}-${_FIXED_TIMESTAMP} --build-arg=REACT_APP_API_URL=${_BACKEND_URL} .
    dir: 'ui'
    waitFor: ['Update Backend Traffic']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Frontend Image'
    args: ['push', '${_IMAGE_REPO}/${_ENVIRONMENT}-frontend:${COMMIT_SHA}-${_FIXED_TIMESTAMP}']
    waitFor: ['Build Frontend Image']

  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Deploy Frontend Service'
    args: ['run', 'deploy', '${_FRONTEND_SERVICE_NAME}', '--image', '${_IMAGE_REPO}/${_ENVIRONMENT}-frontend:${COMMIT_SHA}-${_FIXED_TIMESTAMP}', '--region', '${_REGION}', '--platform', 'managed', '--allow-unauthenticated']
    waitFor: ['Push Frontend Image']

options:
  default_logs_bucket_behavior: 'REGIONAL_USER_OWNED_BUCKET'
