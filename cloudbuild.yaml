steps:
  # 0. Preparation
  - name: 'bash'
    id: 'Generate Timestamp'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        export _FIXED_TIMESTAMP=$(date +%Y%m%d%H%M%S)
        echo "export _FIXED_TIMESTAMP=${_FIXED_TIMESTAMP}" > /workspace/env_vars.sh
        echo "export DB_HOST=/cloudsql/${_SQL_INSTANCE}" >> /workspace/env_vars.sh

  # 1. Backend Build & Push
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Backend Image'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        source /workspace/env_vars.sh
        docker build --no-cache --pull -f api/Dockerfile \
        -t ${_IMAGE_REPO}/backend:${COMMIT_SHA}-${_FIXED_TIMESTAMP} api \
        --build-arg CACHEBUSTER=${_FIXED_TIMESTAMP}

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Backend Image'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        source /workspace/env_vars.sh
        docker push ${_IMAGE_REPO}/backend:${COMMIT_SHA}-${_FIXED_TIMESTAMP}
    waitFor: ['Build Backend Image']

  # 2. Database Migrations (Pre-deployment)
  - name: 'python:3.11'
    id: 'Run Alembic Migrations'
    dir: 'api'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        source /workspace/env_vars.sh
        python3 -m pip install -r requirements.txt
        curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.20.0/cloud-sql-proxy.linux.amd64
        chmod +x cloud-sql-proxy
        mkdir -p /cloudsql
        ./cloud-sql-proxy ${_SQL_INSTANCE} --unix-socket /cloudsql &
        echo "Waiting for Proxy..." && sleep 5
        PYTHONPATH=/workspace alembic -c ./alembic.ini upgrade head
    env:
      - 'DB_USER=dbadmin'
      - 'DB_NAME=finmodel1'
      - 'CLOUD_SQL_CONNECTION_NAME=${_SQL_INSTANCE}'
    secretEnv: ['DB_PASSWORD']
    waitFor: ['Push Backend Image']

  # 3. Deploy Backend
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Deploy Backend'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        source /workspace/env_vars.sh
        gcloud run deploy ${_BACKEND_SERVICE_NAME} \
          --image ${_IMAGE_REPO}/backend:${COMMIT_SHA}-${_FIXED_TIMESTAMP} \
          --region ${_REGION} \
          --platform managed \
          --allow-unauthenticated \
          --set-cloudsql-instances=${_SQL_INSTANCE} \
          --set-env-vars="FRONTEND_URL=${_FRONTEND_URL},PUBLIC_BACKEND_URL=${_BACKEND_URL},CORS_ORIGINS_REGEX=${_CORS_ORIGINS_REGEX},MAIL_SERVER=smtp.gmail.com,MAIL_PORT=587" \
          --update-secrets="DB_PASSWORD=_DB_PASSWORD:${_DB_SECRET_VER},SECRET_KEY=_SECRET_KEY:1,MAIL_PASSWORD=_MAIL_PASSWORD:1" \
          --cpu=1 --memory=512Mi --cpu-boost --concurrency=80 --no-traffic
    waitFor: ['Run Alembic Migrations']

  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Update Traffic'
    args: ['run', 'services', 'update-traffic', '${_BACKEND_SERVICE_NAME}', '--region', '${_REGION}', '--to-latest']
    waitFor: ['Deploy Backend']

  # 4. Frontend Build (Unified Environment Variables)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Frontend'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        source /workspace/env_vars.sh
        docker build --no-cache -t "${_IMAGE_REPO}/frontend:${COMMIT_SHA}-${_FIXED_TIMESTAMP}" \
          --build-arg=REACT_APP_API_URL="${_BACKEND_URL}" \
          --build-arg=VITE_API_URL="${_BACKEND_URL}" .
    dir: 'ui'
    waitFor: ['Update Traffic']

  # 5. Deploy Frontend
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Deploy Frontend'
    args:
      - 'run'
      - 'deploy'
      - '${_FRONTEND_SERVICE_NAME}'
      - '--image=${_IMAGE_REPO}/frontend:${COMMIT_SHA}-${_FIXED_TIMESTAMP}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
    waitFor: ['Build Frontend']

availableSecrets:
  secretManager:
    - versionName: 'projects/${PROJECT_ID}/secrets/_DB_PASSWORD/versions/${_DB_SECRET_VER}'
      env: 'DB_PASSWORD'

options:
  substitution_option: 'ALLOW_LOOSE'
  logging: CLOUD_LOGGING_ONLY