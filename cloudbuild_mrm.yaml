steps:
  # 1. Generate Timestamp
  - name: 'bash'
    id: 'Generate Timestamp'
    script: |
      #!/usr/bin/env bash
      echo $(date +%Y%m%d%H%M%S) > /workspace/timestamp.txt

  # 2. Build Backend (Leveraging Docker Layer Cache)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Backend Image'
    script: |
      TS=$(cat /workspace/timestamp.txt)
      docker build -f api/Dockerfile_mrm \
        -t ${_IMAGE_REPO}/mrm-backend:${COMMIT_SHA}-$TS \
        api

  # 3. Push Backend Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Backend Image'
    script: |
      TS=$(cat /workspace/timestamp.txt)
      docker push ${_IMAGE_REPO}/mrm-backend:${COMMIT_SHA}-$TS

  # 4. Run Alembic Migrations (USES THE BUILT IMAGE)
  # This is much faster because pip install is already done in the Dockerfile!
  - name: '${_IMAGE_REPO}/mrm-backend:${COMMIT_SHA}-$(cat /workspace/timestamp.txt)'
    id: 'Run Alembic Migrations'
    entrypoint: 'bash'
    dir: 'api'
    script: |
      # Download Proxy
      curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.20.0/cloud-sql-proxy.linux.amd64
      chmod +x cloud-sql-proxy
      mkdir -p /cloudsql
      ./cloud-sql-proxy ${_SQL_INSTANCE} --unix-socket /cloudsql &
      
      echo "Waiting for Proxy..."
      sleep 5 
      
      # Run migrations using the environment already set in the image
      PYTHONPATH=/workspace alembic -c ./alembic.ini upgrade head
    secretEnv: ['_DB_PASSWORD']
    env:
      - 'DB_USER=dbadmin'
      - 'DB_NAME=finmodel1'
      - 'CLOUD_SQL_CONNECTION_NAME=${_SQL_INSTANCE}'
    waitFor: ['Push Backend Image']

  # 5. Build Frontend (Now with a grep check to catch that CSS warning)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Frontend Image'
    entrypoint: 'bash'
    dir: 'ui'
    script: |
      # Fail the build if camelCase CSS is found (Optional, but keeps code clean)
      if grep -r "marginBottom:" .; then
        echo "ERROR: Found invalid CSS property 'marginBottom'. Use 'margin-bottom'."
        exit 1
      fi
      TS=$(cat /workspace/timestamp.txt)
      docker build -t ${_IMAGE_REPO}/mrm-frontend:${COMMIT_SHA}-$TS \
        --build-arg=REACT_APP_API_URL=${_BACKEND_URL} .
    waitFor: ['Generate Timestamp']

  # 6. Push & Deploy (Simplified for brevity)
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'Deploy Backend'
    script: |
      TS=$(cat /workspace/timestamp.txt)
      gcloud run deploy ${_BACKEND_SERVICE_NAME} \
        --image ${_IMAGE_REPO}/mrm-backend:${COMMIT_SHA}-$TS \
        --region ${_REGION} \
        --update-secrets=TWILIO_ACCOUNT_SID=_TWILIO_ACCOUNT_SID:1,TWILIO_AUTH_TOKEN=_TWILIO_AUTH_TOKEN:1,TWILIO_FROM_NUMBER=_TWILIO_FROM_NUMBER:1 \
        # ... include your other flags here ...
    waitFor: ['Run Alembic Migrations']

# Add your availableSecrets and substitutions below as before
options:
  automapSubstitutions: true
  default_logs_bucket_behavior: 'REGIONAL_USER_OWNED_BUCKET'

availableSecrets:
  secretManager:
    - versionName: 'projects/${PROJECT_ID}/secrets/_DB_PASSWORD/versions/${_DB_SECRET_VER}'
      env: '_DB_PASSWORD'
