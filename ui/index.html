<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo_final.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0F2847" />
    <meta name="description" content="Model My Retirement - Retirement Planning Tool" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="apple-touch-icon" href="/logo_final.png" />
    
    <link rel="manifest" href="/manifest.json" />
    <title>Model My Retirement</title>

    <script>
      (function() {
        var host = window.location.hostname;
        
        // 1. Redirect www to non-www for both domains
        if (host === 'www.modelmyretirement.com' || host === 'www.ordaxium.com') {
          var targetHost = host.replace('www.', '');
          window.location.replace('https://' + targetHost + window.location.pathname + window.location.search);
          return; 
        }
    
        var isDev = host.includes('ordaxium');
        
        // 2. Inject the correct sitemap for the current domain
        var sitemapFile = isDev ? '/sitemap-ordaxium.xml' : '/sitemap-modelmyretirement.xml';
        var link = document.createElement('link');
        link.rel = 'alternate';
        link.type = 'application/xml';
        link.title = 'Sitemap';
        link.href = sitemapFile;
        document.getElementsByTagName('head')[0].appendChild(link);
    
        // 3. Tell search engines to ignore the site if it's the dev domain
        if (isDev) {
          var meta = document.createElement('meta');
          meta.name = 'robots';
          meta.content = 'noindex, nofollow';
          document.getElementsByTagName('head')[0].appendChild(meta);
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js" async></script>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
